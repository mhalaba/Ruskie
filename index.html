      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Atlas garnizonów SZ FR",
        "url": "https://mhalaba.github.io/Ruskie/"

  </head>
  <body>
    <a class="skip-link" href="#map" data-i18n="skip">Przejdź do mapy</a>
    <div id="app">
      <aside id="sidebar" class="sidebar" data-i18n-aria="panelAria" aria-label="Panel filtrów i hierarchii">
        <header class="brand">
          <p class="brand-kicker">Ruskie</p>
          <h1 data-i18n="title">Atlas garnizonów SZ FR</h1>
          <p class="tagline" data-i18n="tagline">Źródła otwarte · szczebel brygada / dywizja · bez teatru UA</p>
          <nav class="lang-switch" data-i18n-aria="lang" aria-label="Język">
            <a href="./" data-lang="pl" hreflang="pl" lang="pl">PL</a>
            <a href="./?lang=en" data-lang="en" hreflang="en" lang="en">EN</a>
            <a href="./?lang=de" data-lang="de" hreflang="de" lang="de">DE</a>
          </nav>
        </header>

        <label class="search-wrap">
          <span class="sr-only" data-i18n="search">Szukaj</span>
          <input
            id="search"
            type="search"
            data-i18n-placeholder="searchPh"
            placeholder="Nazwa, numer, miejscowość, w/cz…"
            autocomplete="off"
          />
        </label>
        <p id="result-count" class="tagline result-count"></p>

        <section class="block">
          <h2 data-i18n="layers">Warstwy</h2>
          <label><input type="checkbox" data-layer="ground" checked /> <span data-i18n="layer_ground">Wojska Lądowe</span></label>
          <label><input type="checkbox" data-layer="vdv" checked /> <span data-i18n="layer_vdv">WDW (VDV)</span></label>
          <label><input type="checkbox" data-layer="naval_infantry" checked /> <span data-i18n="layer_naval">Piechota morska / nadbrzeżne</span></label>
          <label><input type="checkbox" data-layer="gru" checked /> <span data-i18n="layer_gru">Spetsnaz GRU</span></label>
          <label><input type="checkbox" data-layer="vks" checked /> <span data-i18n="layer_vks">WKS</span></label>
          <label><input type="checkbox" data-layer="rvsn" checked /> <span data-i18n="layer_rvsn">WRPS</span></label>
          <label><input type="checkbox" data-layer="ew" checked /> <span data-i18n="layer_ew">Walka radioelektroniczna (WRE)</span></label>
          <label><input type="checkbox" data-layer="industry" checked /> <span data-i18n="layer_industry">Zakłady zbrojeniowe (miasto)</span></label>
          <label><input type="checkbox" data-layer="extraterritorial" /> <span data-i18n="layer_extra">Zagranica</span></label>
          <label><input type="checkbox" data-layer="crimea" /> <span data-i18n="layer_crimea">Krym (okupowany)</span></label>
          <label><input type="checkbox" data-layer="sketch" /> <span data-i18n="layer_sketch">Szkic / unverified</span></label>
        </section>

        <section class="block">
          <h2 data-i18n="filters">Filtry</h2>
          <label>
            <span data-i18n="district">Okręg</span>
            <select id="filter-district">
              <option value="" data-i18n="all">Wszystkie</option>
            </select>
          </label>
          <label>
            <span data-i18n="echelon">Szczebel</span>
            <select id="filter-echelon">
              <option value="" data-i18n="all">Wszystkie</option>
            </select>
          </label>
          <label>
            <span data-i18n="formation">Status formowania</span>
            <select id="filter-formation">
              <option value="" data-i18n="all">Wszystkie</option>
            </select>
          </label>
          <label>
            <span data-i18n="minConf">Minimalna pewność</span>
            <select id="filter-confidence">
              <option value="medium" selected data-i18n="conf_medium">Średnia i wyższa (domyślnie)</option>
              <option value="high" data-i18n="conf_high">Tylko wysoka</option>
              <option value="low" data-i18n="conf_low">Niska i wyższa</option>
              <option value="unverified" data-i18n="conf_unverified">Pokaż także szkic</option>
            </select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="filter-rf-only" />
            <span data-i18n="rfOnly">Tylko garnizony RF</span>
            <span class="hint" data-i18n="rfHint">(ukrywa Krym, Abchazję, Osetię, Syrię i inne bazy zagraniczne)</span>
          </label>
        </section>

        <section class="block actions">
          <button type="button" id="btn-export" data-i18n="export">Eksport widoku (GeoJSON)</button>
          <button type="button" id="btn-theme" data-i18n="themeLight">Tryb jasny</button>
          <button type="button" id="btn-glossary" data-i18n="glossaryBtn">Słownik WRE</button>
        </section>

        <section class="block tree-block">
          <h2 data-i18n="hierarchy">Hierarchia</h2>
          <div id="tree" class="tree"></div>
        </section>
      </aside>

      <main class="map-wrap">
        <div id="map" role="application" data-i18n-aria="mapAria" aria-label="Mapa garnizonów"></div>
        <button type="button" id="btn-sidebar" class="fab" data-i18n-aria="sidebar" aria-label="Panel">☰</button>
      </main>

      <article id="card" class="card hidden" aria-live="polite">
        <button type="button" id="card-close" data-i18n-aria="close" aria-label="Zamknij">×</button>
        <div id="card-body"></div>
      </article>

      <article id="glossary" class="card hidden" aria-live="polite">
        <button type="button" id="glossary-close" data-i18n-aria="close" aria-label="Zamknij">×</button>
        <div id="glossary-body"></div>
      </article>

      <footer class="disclaimer">
        <span id="footer-text"></span>
      </footer>
    </div>
  </body>
</html>
